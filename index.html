<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlixTime Premium</title>
    <style>
        :root {
            --bg-color: #0A1128;
            --accent-color: #FF0044;
            --text-color: #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            padding-bottom: 20px;
        }
        header {
            position: sticky;
            top: 0;
            background-color: rgba(10, 17, 40, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: var(--accent-color);
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            outline: none;
        }
        .category {
            margin-top: 25px;
            padding-left: 15px;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #ddd;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }
        .row {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-right: 15px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .row::-webkit-scrollbar { display: none; }
        .poster {
            width: 130px;
            height: 195px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            flex-shrink: 0;
            background: #1a2238;
        }
        #playerModal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        .player-header {
            background-color: #111;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .control-group {
            display: flex;
            gap: 6px;
        }
        .btn-custom {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-custom.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        #closeBtn {
            background-color: transparent;
            color: white;
            border: 1px solid white;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .media-container {
            flex-grow: 1;
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #playerIframe, #nativeVideo {
            width: 100%;
            height: 100%;
            border: none;
        }
        #loadingMsg {
            text-align: center;
            padding: 15px;
            color: var(--accent-color);
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>FlixTime</h1>
        <input type="text" id="searchInput" placeholder="Search movies, shows...">
    </header>

    <main>
        <div id="loadingMsg">Hindi movie talashi ja rahi hai...</div>
        <div id="searchResults" class="category" style="display:none;">
            <h2>Search Results</h2>
            <div class="row" id="searchRow"></div>
        </div>
        <div class="category">
            <h2>🔥 Latest Releases</h2>
            <div class="row" id="latestRow"></div>
        </div>
        <div class="category">
            <h2>Bollywood & Hollywood Hits</h2>
            <div class="row" id="bollywoodRow"></div>
        </div>
    </main>

    <div id="playerModal">
        <div class="player-header">
            <div class="control-group">
                <button class="btn-custom active" id="btnSrv1" onclick="switchServer(1)">Server 1 (Direct Hindi)</button>
                <button class="btn-custom" id="btnSrv2" onclick="switchServer(2)">Server 2 (Backup)</button>
                <button class="btn-custom" id="btnSrv3" onclick="switchServer(3)">Server 3 (Alt)</button>
            </div>
            <button id="closeBtn">X Close</button>
        </div>
        
        <div class="media-container" id="mediaBox">
            <iframe id="playerIframe" allowfullscreen style="display:none;"></iframe>
            <video id="nativeVideo" controls controlsList="nodownload" style="display:none;"></video>
        </div>
    </div>

    <script>
        const API_KEY = '2d45e26903f728b925fea962b8e7ddf0';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKEND_URL = 'https://flixbackend-zpgi.onrender.com';

        let activeLinks = { s1: '', s2: '', s3: '', type: 'embed' };

        const categories = [
            { id: 'latestRow', url: `/movie/now_playing?api_key=${API_KEY}&region=IN` },
            { id: 'bollywoodRow', url: `/discover/movie?api_key=${API_KEY}&with_original_language=hi&sort_by=popularity.desc` }
        ];

        function fetchMovies(url, rowId) {
            fetch(BASE_URL + url)
                .then(res => res.json())
                .then(data => {
                    const row = document.getElementById(rowId);
                    if(data.results) {
                        data.results.forEach(item => {
                            if(item.poster_path) {
                                const img = document.createElement('img');
                                img.src = IMG_URL + item.poster_path;
                                img.className = 'poster';
                                img.onclick = () => selectMovie(item);
                                row.appendChild(img);
                            }
                        });
                    }
                });
        }
        categories.forEach(cat => fetchMovies(cat.url, cat.id));

        async function selectMovie(item) {
            const title = item.title || item.name;
            loadingMsg.style.display = 'block';
            loadingMsg.innerText = `Searching Hindi link for "${title}"...`;

            try {
                const response = await fetch(`${BACKEND_URL}/find_hindi_movie?title=${encodeURIComponent(title)}`);
                const data = await response.json();
                loadingMsg.style.display = 'none';

                if(data.status === 'success') {
                    activeLinks.s1 = data.server1;
                    activeLinks.s2 = data.server2;
                    activeLinks.s3 = data.server3;
                    activeLinks.type = data.type;

                    openPlayerModal();
                    switchServer(1);
                }
            } catch (err) {
                loadingMsg.style.display = 'none';
                activeLinks.s1 = `https://vidsrc.to/embed/movie/${item.id}`;
                activeLinks.type = 'embed';
                openPlayerModal();
                switchServer(1);
            }
        }

        const iframe = document.getElementById('playerIframe');
        const video = document.getElementById('nativeVideo');

        function openPlayerModal() {
            document.getElementById('playerModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function switchServer(num) {
            document.getElementById('btnSrv1').classList.remove('active');
            document.getElementById('btnSrv2').classList.remove('active');
            document.getElementById('btnSrv3').classList.remove('active');
            document.getElementById(`btnSrv${num}`).classList.add('active');

            let targetLink = num === 1 ? activeLinks.s1 : (num === 2 ? activeLinks.s2 : activeLinks.s3);

            // Agar Server 1 direct pixeldrain/video link hai toh video player chalega, warna iframe
            if (num === 1 && activeLinks.type === 'direct' && (targetLink.includes('pixeldrain') || targetLink.endsWith('.mp4') || targetLink.endsWith('.mkv'))) {
                iframe.style.display = 'none';
                video.style.display = 'block';
                video.src = targetLink;
                video.play().catch(e => console.log("Auto-play blocked"));
            } else {
                video.style.display = 'none';
                video.pause();
                video.src = '';
                iframe.style.display = 'block';
                iframe.src = targetLink;
            }
        }
        
        document.getElementById('closeBtn').onclick = () => {
            document.getElementById('playerModal').style.display = 'none';
            iframe.src = '';
            video.pause();
            video.src = '';
            document.body.style.overflow = '';
        };
    </script>
</body>
</html>
